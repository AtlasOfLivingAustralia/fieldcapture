apply plugin:"maven-publish"
publishing {
    repositories {
        maven {
            name 'GitHubPackages'
            url uri("https://maven.pkg.github.com/atlasoflivingaustralia/fieldcapture")
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
    publications {
        mavenJar(MavenPublication) {
            artifact bootJar
        }
    }
}
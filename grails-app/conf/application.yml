---
appName:
  "fieldcapture"

server:
  address: localhost
  servlet:
    session:
      timeout: 3600
  tomcat:
    accessLog:
        enabled: true
        pattern: "%h %l %u %t \"%r\" %s %b %D"

environments:
    development:
      server:
        port: 8087
spring:
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB
  devtools:
    livereload:
      enabled: true
    restart:
      additional-exclude:
        - '**/*.gsp'
        - '**/*.css'
        - '**/*.js'
management:
  endpoints:
    access:
      default: none
